<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>
        AI Voice Interviewer
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    />
</head>

<body>

    <div class="background-glow"></div>

    <div class="container">

        <div class="avatar-container">

            <div
                class="avatar"
                id="avatar"
            >
                <div class="eyes"></div>

                <div
                    class="mouth"
                    id="mouth"
                ></div>
            </div>

        </div>

        <h1>
            AI Voice Interviewer
        </h1>

        <button id="startBtn">
            Start Interview
        </button>

        <div class="status">
            <span id="status">
                Ready
            </span>
        </div>

        <div class="card">

            <h2>
                AI Reaction
            </h2>

            <p id="reaction"></p>

        </div>

        <div class="card">

            <h2>
                Feedback
            </h2>

            <p id="feedback"></p>

        </div>

        <div class="card">

            <h2>
                Next Question
            </h2>

            <p id="question"></p>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
